<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آرشیو گزارش‌ها | دستیار خبری شهاب</title>

<link rel="stylesheet" href="assets/style.css">

</head>


<body>

<div class="container">


<header>

<h1>📚 آرشیو گزارش‌ها</h1>

<p>گزارش‌های روزانه دستیار خبری شهاب</p>

</header>


<a class="archive-btn" href="index.html">
بازگشت به صفحه اصلی
</a>



<h2 class="section-title finance">
گزارش‌های ذخیره شده
</h2>


<div id="reports-list">

<div class="card">
در حال دریافت گزارش‌ها...
</div>

</div>



<footer>
Powered by Shahabaiagent_bot
</footer>



</div>


<script>

fetch("reports/index.json")

.then(response => response.json())

.then(data => {


let box = document.getElementById("reports-list");

box.innerHTML = "";


data.forEach(item => {


box.innerHTML += `

<div class="card">

<h3>${item.title}</h3>

<p class="meta">
📅 ${item.date}
</p>


<a href="reports/${item.file}">
مشاهده گزارش
</a>


</div>

`;


});


})

.catch(() => {

document.getElementById("reports-list").innerHTML =
"<div class='card'>خطا در دریافت آرشیو</div>";

});


</script>


</body>

</html>
