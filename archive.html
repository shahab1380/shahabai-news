
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آرشیو گزارش‌ها | Shahabai News</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>آرشیو گزارش‌های خبری</h1>
      <p>گزارش‌های روزانه Shahabai News Agent</p>
    </header>

    <a class="archive-btn" href="index.html">بازگشت به صفحه اصلی</a>

    <section>
      <h2 class="section-title finance">گزارش‌های ذخیره‌شده</h2>
      <div id="reports-list">
        <div class="card">
          <p>برای مشاهده گزارش‌ها، فهرست در حال بارگذاری است...</p>
        </div>
      </div>
    </section>

    <footer>Powered by Shahabaiagent_bot</footer>
  </div>

  <script>
    fetch('reports/index.json')
      .then(response => {
        if (!response.ok) throw new Error('فهرست آرشیو پیدا نشد');
        return response.json();
      })
      .then(reports => {
        const list = document.getElementById('reports-list');
        list.replaceChildren();

        if (!reports.length) {
          list.textContent = 'هنوز گزارشی در آرشیو ثبت نشده است.';
          return;
        }

        reports.forEach(report => {
          const card = document.createElement('div');
          card.className = 'card';

          const title = document.createElement('h3');
          title.textContent = report.title || report.date;

          const date = document.createElement('p');
          date.className = 'meta';
          date.textContent = 'تاریخ گزارش: ' + report.date;

          const link = document.createElement('a');
          link.href = 'reports/' + encodeURIComponent(report.file);
          link.textContent = 'مشاهده گزارش';

          card.append(title, date, link);
          list.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('reports-list').textContent =
          'هنوز فهرست آرشیو ساخته نشده است.';
      });
  </script>
</body>
</html>
